name: Build LSIO Mod

on:
  push:
    branches: [main]
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner name
        run: |
          echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push mod image
        uses: docker/build-push-action@v6
        with:
          context: ./mod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/emby-customcssjs:latest
            ghcr.io/${{ env.OWNER_LC }}/emby-customcssjs:${{ github.sha }}
